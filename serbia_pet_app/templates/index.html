<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udomi Ljubimca - Srbija</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🐾 Udomi Ljubimca <span class="text-warning">Srbija</span></a>
            <span class="navbar-text text-white-50">Pronađite svog novog najboljeg prijatelja</span>
        </div>
    </nav>

    <div class="container my-5">
        
        <!-- Başlıq və Filterlər -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-6">
                <h2 class="fw-bold">Pronađite ljubimca za udomljavanje</h2>
                <p class="text-muted">Spasite život i pružite dom ljubimcima širom Srbije.</p>
            </div>
            <div class="col-md-6 text-md-end">
                <div class="btn-group shadow-sm" role="group">
                    <button class="btn btn-outline-success active" onclick="filterPets('All', 'All')">Sve</button>
                    <button class="btn btn-outline-success" onclick="filterPets('Pas', 'All')">Psi</button>
                    <button class="btn btn-outline-success" onclick="filterPets('Mačka', 'All')">Mačke</button>
                </div>
            </div>
        </div>

        <!-- Şəhər Filtri (Bütün şəhərlər) -->
        <div class="row mb-4">
            <div class="col-md-4">
                <select id="city-filter" class="form-select shadow-sm" onchange="applyFilters()">
                    <option value="All">Svi gradovi (Srbija)</option>
                    <option value="Beograd">Beograd</option>
                    <option value="Novi Sad">Novi Sad</option>
                    <option value="Niš">Niš</option>
                    <option value="Kragujevac">Kragujevac</option>
                    <option value="Subotica">Subotica</option>
                    <option value="Zrenjanin">Zrenjanin</option>
                    <option value="Pančevo">Pančevo</option>
                    <option value="Čačak">Čačak</option>
                    <option value="Kruševac">Kruševac</option>
                    <option value="Kraljevo">Kraljevo</option>
                    <option value="Smederevo">Smederevo</option>
                    <option value="Leskovac">Leskovac</option>
                    <option value="Valjevo">Valjevo</option>
                    <option value="Vranje">Vranje</option>
                    <option value="Šabac">Šabac</option>
                    <option value="Užice">Užice</option>
                    <option value="Novi Pazar">Novi Pazar</option>
                    <option value="Sombor">Sombor</option>
                    <option value="Požarevac">Požarevac</option>
                    <option value="Pirot">Pirot</option>
                    <option value="Zaječar">Zaječar</option>
                    <option value="Kikinda">Kikinda</option>
                    <option value="Sremska Mitrovica">Sremska Mitrovica</option>
                    <option value="Jagodina">Jagodina</option>
                    <option value="Vrbas">Vrbas</option>
                </select>
            </div>
        </div>

        <!-- Heyvan Siyahısı -->
        <div class="row" id="pets-list">
            <!-- JS ilə dolacaq -->
        </div>

        <!-- Yeni Elan Yerləşdirmə Formu -->
        <div class="card shadow border-0 p-4 mt-5 bg-white rounded">
            <h4 class="mb-3 text-success">📢 Postavite oglas za udomljavanje</h4>
            <p class="text-muted small">Imate napuštenog ljubimca ili ste ga pronašli? Unesite podatke i kontaktirajte zainteresovane.</p>
            
            <form id="add-pet-form" onsubmit="addNewPet(event)">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">Ime ljubimca</label>
                        <input type="text" id="pet-name" class="form-control" placeholder="Npr. Riki" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">Vrsta</label>
                        <select id="pet-type" class="form-select">
                            <option value="Pas">Pas</option>
                            <option value="Mačka">Mačka</option>
                            <option value="Ptica">Ptica</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">Rasa</label>
                        <input type="text" id="pet-breed" class="form-control" placeholder="Npr. Labrador" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">Grad</label>
                        <select id="pet-city" class="form-select">
                            <option value="Beograd">Beograd</option>
                            <option value="Novi Sad">Novi Sad</option>
                            <option value="Niš">Niš</option>
                            <option value="Kragujevac">Kragujevac</option>
                            <option value="Subotica">Subotica</option>
                            <option value="Zrenjanin">Zrenjanin</option>
                            <option value="Pančevo">Pančevo</option>
                            <option value="Čačak">Čačak</option>
                            <option value="Kruševac">Kruševac</option>
                            <option value="Kraljevo">Kraljevo</option>
                            <option value="Smederevo">Smederevo</option>
                            <option value="Leskovac">Leskovac</option>
                            <option value="Valjevo">Valjevo</option>
                            <option value="Vranje">Vranje</option>
                            <option value="Šabac">Šabac</option>
                            <option value="Užice">Užice</option>
                            <option value="Novi Pazar">Novi Pazar</option>
                            <option value="Sombor">Sombor</option>
                            <option value="Požarevac">Požarevac</option>
                            <option value="Pirot">Pirot</option>
                            <option value="Zaječar">Zaječar</option>
                            <option value="Kikinda">Kikinda</option>
                            <option value="Sremska Mitrovica">Sremska Mitrovica</option>
                            <option value="Jagodina">Jagodina</option>
                            <option value="Vrbas">Vrbas</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">Starost</label>
                        <input type="text" id="pet-age" class="form-control" placeholder="Npr. 1 godina" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">Vaše ime (ili organizacija)</label>
                        <input type="text" id="pet-owner" class="form-control" placeholder="Vaše ime" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Kontakt telefon</label>
                        <input type="text" id="pet-phone" class="form-control" placeholder="+381 6X XXX XXXX" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Opis i karakter</label>
                        <input type="text" id="pet-desc" class="form-control" placeholder="Kratak opis ljubimca" required>
                    </div>
                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-success fw-bold px-4">Objavi oglas</button>
                    </div>
                </div>
            </form>
        </div>

    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
