<!-- Dodavanje novog oglasa -->
<div class="container my-5">
    <h2 class="text-center mb-4">Dodaj novi oglas za ljubimca</h2>
    <form action="/add" method="POST" class="row g-3 p-4 border rounded shadow-sm bg-light">
        <div class="col-md-6">
            <label class="form-label">Ime ljubimca</label>
            <input type="text" class="form-control" name="name" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Vrsta (Mačka / Pas)</label>
            <input type="text" class="form-control" name="type" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Rasa</label>
            <input type="text" class="form-control" name="breed" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Grad (npr. Beograd, Novi Sad)</label>
            <input type="text" class="form-control" name="city" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Starost</label>
            <input type="text" class="form-control" name="age" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Kontakt telefon</label>
            <input type="text" class="form-control" name="phone" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Link slike (URL)</label>
            <input type="url" class="form-control" name="image" placeholder="https://...">
        </div>
        <div class="col-12 text-center mt-3">
            <button type="submit" class="btn btn-success px-5">Objavi oglas</button>
        </div>
    </form>
</div>
